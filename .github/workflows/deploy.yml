name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build output
        run: |
          echo "Contenido de .output/public:"
          find .output/public -maxdepth 2 -type f | sort

      - name: Ensure index.html exists
        run: |
          if [ -d .output/public ]; then
            cd .output/public
            if [ ! -f index.html ]; then
              FIRST_HTML=$(find . -maxdepth 1 -name "*.html" -type f | head -n 1)
              if [ -n "$FIRST_HTML" ]; then
                cp "$FIRST_HTML" index.html
              fi
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
