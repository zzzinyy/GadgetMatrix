name: Deploy to GitHub Pages
on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Diagnose dev references in artifact
        run: |
          echo "--- file types ---"
          file .output/public/index.html .output/public/auth/index.html || true
          echo "--- ls public ---"
          ls -la .output/public | head -30
          echo "--- context of dev-entry matches in HTML ---"
          grep -a -o -E '.{0,150}virtual:tanstack-start-dev-client-entry.{0,150}' -r .output/public --include='*.html' | head -20 || true
          echo "--- context of dev-entry matches in JS ---"
          grep -a -o -E '.{0,150}virtual:tanstack-start-dev-client-entry.{0,150}' -r .output/public --include='*.js' | head -20 || true
          echo "--- @id matches ---"
          grep -a -o -E '.{0,120}/@id/.{0,120}' -r .output/public | head -20 || true
          echo "--- head of index.html (first 2000 bytes) ---"
          head -c 2000 .output/public/index.html || true
          echo ""
          echo "--- failing check ---"
          if grep -a -R "virtual:tanstack-start-dev-client-entry" .output/public; then
            echo "::error::Quedan referencias dev en el artefacto de produccion"
            exit 1
          fi

      - name: Create GitHub Pages fallback
        run: cp .output/public/index.html .output/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.output/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
